[package]
name = "git-wipe"
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Axel H. <noirbizarre@gmail.com>"]
description = "Wipe out merged local branches and worktrees"
repository = "https://github.com/noirbizarre/git-wipe"
readme = "README.md"
keywords = ["git", "branches", "worktree", "cleanup", "merged"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[[bin]]
name = "git-wipe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
demand = "2"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[build-dependencies]
# `build.rs` compiles `src/cli.rs` (and the modules it uses) out of tree to
# derive the man pages and completions, so their dependencies are needed here
# too.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
