# Toolchain and task definitions.
#
# Tool versions are resolved to exact builds in `mise.lock`, which is committed.
# CI installs from these two files, so local runs and CI runs use identical tool versions.
#
# Tools no CI job needs are declared on their own task rather than in `[tools]`,
# because `mise install` — what CI runs — installs `[tools]` only.
# It matters as cargo-binstall has no prebuilt artifact for some cargo tools,
# so a global entry would make every CI job compile them from source.
[settings]
# Resolve tools through mise.lock and keep it updated.
lockfile = true

# Do not let mise adopt `rust-toolchain.toml`.
# Rust is installed by rustup locally and by `dtolnay/rust-toolchain` in CI,
# which handle per-job components and cross-compilation targets that mise does not.
# Leaving both in charge would have mise shadow the toolchain CI just installed.
idiomatic_version_file_enable_tools = []

[tools]
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is absent
# Keep the explicit key aligned with mise.lock so CI's locked installs can resolve it.
shellcheck = "latest"
prek = "latest"
typos = "latest"
git-cliff = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:git-tpl" = "latest"

# --- begin project-specific tools ---
# Add project-wide tools here; tools needed by only one task belong on that task.
# --- end project-specific tools ---

[hooks]
postinstall = [
  "prek install"
]

# --- Everyday ---------------------------------------------------------------
[tasks.default]
description = "Run format, lint, build and test"
depends = ["format", "lint", "lint:actions", "lint:md", "build", "test"]

[tasks.build]
description = "Build the project"
run = "cargo build"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "mise.lock",
  ".cargo/config",
  ".cargo/config.toml",
  "build.rs",
  "src/**",
]
outputs = [
  'target/debug/git-wipe{% if os() == "windows" %}.exe{% endif %}',
  "target/debug/libgit_wipe.rlib",
]

[tasks.test]
description = "Run tests (accepts nextest selectors)"
raw_args = true
run = "cargo nextest run"

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest"

[tasks.format]
description = "Format the code"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check the formatting without rewriting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint the code"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Suppressions live in .github/actionlint.yml rather than as flags here,
# so this task and the prek hook cannot drift apart.
run = "actionlint .github/workflows/*.yaml"

[tasks."lint:md"]
description = "Lint all project Markdown"
# Install the native binary only for this task; keep its version aligned with
# the rumdl pre-commit hook in prek.toml.
tools = { rumdl = "0.3.2" }
# The shared rumdl config excludes the generated root CHANGELOG.md.
run = "rumdl check ."

[tasks.snapshots]
description = "Review and update insta snapshots interactively"
# cargo-insta is declared here as only used once by this task
tools = { "cargo:cargo-insta" = "latest" }
run = "cargo insta review"

[tasks.check]
description = "Run every check that does not modify the working tree"
depends = ["format:check", "lint", "lint:actions", "lint:md", "spell", "test"]

[tasks.ci]
description = "Everything CI runs, locally"
depends = ["check"]

# --- git-wipe itself ---------------------------------------------------

[tasks.cli]
description = "Run git-wipe from source"
raw_args = true
run = "cargo run --bin git-wipe --"

[tasks.setup]
description = "Install locally"
# `cargo install` only installs the binary. The man pages matter beyond
# convenience: `git wipe --help` is rewritten by git into `git help wipe`, which
# runs `man git-wipe` and fails outright when no page is installed.
depends = ["man"]
run = """
set -euo pipefail
cargo install --path . --force

man_dir="${XDG_DATA_HOME:-$HOME/.local/share}/man/man1"
mkdir -p "$man_dir"
cp dist/man/*.1 "$man_dir/"
echo "man pages -> $man_dir"

comp_dir="${XDG_DATA_HOME:-$HOME/.local/share}/zsh/site-functions"
mkdir -p "$comp_dir"
cp dist/completions/_git-wipe "$comp_dir/"
echo "zsh completions -> $comp_dir (ensure it is on \\$fpath)"
"""

[tasks.man]
description = "Collect the generated man page and shell completions into dist/"
# build.rs writes them into the build script's OUT_DIR, which cargo places in
# a hash-suffixed directory. Rather than guessing the hash, ask cargo where
# the build script ran via its JSON message stream.
tools = { jq = "latest" }
run = """
#!/usr/bin/env bash
set -euo pipefail
out=$(cargo build --message-format=json 2>/dev/null \
  | jq -r 'select(.reason == "build-script-executed") | select(.package_id | test("git-wipe")) | .out_dir' \
  | tail -n 1)
test -n "$out" || { echo "could not locate OUT_DIR" >&2; exit 1; }
rm -rf dist/man dist/completions
mkdir -p dist/man dist/completions
cp "$out"/man/*.1 dist/man/
cp "$out"/completions/* dist/completions/
echo "dist/man ($(ls dist/man | wc -l) pages), dist/completions ($(ls dist/completions | wc -l) shells)"
"""

# --- Release ----------------------------------------------------------------

[tasks.changelog]
description = "Preview the changelog for the unreleased commits"
run = "git cliff --unreleased"

[tasks.release]
description = "Show the version the next release would take"
# The release itself is driven by gh-ship from .github/workflows/ship.yaml.
# This task exists to answer 'what would ship next?' without opening CI.
run = "git cliff --bumped-version"

[tasks."ship:validate"]
description = "Check the release setup against what gh-ship requires"
run = "gh ship validate"

# --- Template ---------------------------------------------------------------
#
# This project is rendered from https://github.com/noirbizarre/rust.tpl
# To update it:
#
#   mise tpl:check       # has it moved?
#   mise tpl:update      # bring the rendered ref up to date
#   mise tpl:diff        # read what merging it would change
#   mise tpl:merge       # take it

[tasks."tpl:update"]
description = "Advance refs/tpl/<id>; may save migrated answers without merging rendered files"
raw_args = true
run = "git tpl update"

[tasks."tpl:diff"]
description = "Show what merging the template would change"
raw_args = true
run = "git tpl diff"

[tasks."tpl:merge"]
description = "Merge the last updated rendered files"
raw_args = true
run = "git tpl merge"

[tasks."tpl:check"]
description = "Has the template moved? Exits 1 if merging it would change anything"
run = [
  "git tpl update",
  "git tpl diff --exit-code --stat",
]

# --- project-specific tasks --------------------------------------------------
#
# Add your own tasks below this line and global tools between the tools markers.
# Group related project tasks here; the template owns the sections above.
# Git's 3-way merge preserves project additions across template merges.

# --- Artwork ----------------------------------------------------------------
#
# Not part of `default` or `check`: they rewrite committed files, so a routine
# run would dirty the working tree every time. Run them when the artwork
# changes, in order: `logo` re-flattens the wordmark, then `social` re-renders
# the preview that embeds it.

[tasks.logo]
description = "Flatten the wordmark source into docs/images/logo.svg"
# logo.svg is committed as paths only, never as live <text>: it is served to
# every README reader from raw.githubusercontent.com, and a <text> wordmark
# would be re-set in whatever font the reader happens to have. usvg converts
# text to paths by default, which is exactly the flattening step, so the
# editable source stays logo.src.svg and the outlined result is generated.
#
# Requires Fira Sans on the machine running it — a missing font silently
# substitutes another, so check the diff before committing.
#
# Declared on the task rather than in `[tools]` for the same reason as resvg
# below: `mise install` in CI would otherwise build it from source.
tools = { "cargo:usvg" = "latest" }
run = """
set -euo pipefail
usvg docs/images/logo.src.svg docs/images/logo.svg
grep -q '<text' docs/images/logo.svg && { echo "logo.svg still carries live text" >&2; exit 1; }

# usvg resolves the viewBox into a transform and emits width/height only. That
# renders fine on its own but does not scale: social-preview.svg embeds the logo
# through <image width height>, which needs an intrinsic aspect ratio to fit
# into. Putting the viewBox back is what keeps the embedded mark from being
# drawn at 1:1 and clipped.
read -r w h < <(sed -n 's/.*width="\\([0-9.]*\\)" height="\\([0-9.]*\\)".*/\\1 \\2/p' docs/images/logo.svg | head -n 1)
test -n "$w" && test -n "$h"
sed -i "0,/<svg /s|<svg |<svg viewBox=\\"0 0 $w $h\\" |" docs/images/logo.svg
grep -q 'viewBox=' docs/images/logo.svg

echo "docs/images/logo.svg — ${w}x${h}; re-run 'mise run social' to refresh the preview"
"""

[tasks.social]
description = "Render the GitHub social preview image"
# GitHub has no API for the social preview, so this is generated here and
# uploaded by hand, once, under:
#   Settings -> General -> Social preview
#
# The canvas lives in social-preview.svg rather than being passed as flags:
# resvg scales to fit rather than padding, so --width 1280 --height 640 on a
# non-2:1 source yields the wrong size, not GitHub's required 1280x640.
#
# resvg is declared on the task rather than in `[tools]` because `mise install`
# — what CI runs — installs `[tools]` only, and cargo-binstall has no prebuilt
# artifact for resvg: a global entry would make every CI job build it from
# source.
tools = { "cargo:resvg" = "latest" }
run = """
resvg docs/images/social-preview.svg docs/images/social-preview.png
echo "docs/images/social-preview.png — upload under Settings > General > Social preview"
"""
