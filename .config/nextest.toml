# nextest configuration.

[profile.default]
# Cap each test at four 30-second elapsed periods, even if it keeps printing progress.
# This bounds hangs before they consume the full runner timeout.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# CI wants the full picture from one run, not the first failure.
fail-fast = false
failure-output = "immediate-final"
status-level = "skip"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"
