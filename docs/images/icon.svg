<!--
  A placeholder mark: two glyph-free shapes, so it reads as "not yet designed"
  rather than as a logo somebody chose. Replace it with your square icon.
  The documentation header and favicon use this file. The README and docs
  landing page also use it when no SVG or raster wordmark is selected.

  Keep it a square viewBox. The header slot scales to a fixed height, and a
  non-square source is letterboxed rather than cropped.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="placeholder mark">
  <rect width="64" height="64" rx="14" fill="#64748b" opacity="0.2"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#64748b" stroke-width="4"/>
</svg>
