name: 📦 Publish Release

# No correlation input: gh-ship dispatches this on the tag itself, which is
# what it correlates on. See https://noirbizarre.github.io/gh-ship/workflows/

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag being released
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  # gh-ship has already created the tag and the GitHub Release as a DRAFT, so
  # these assets land before anyone watching the repository is notified.
  # `upload-rust-binary-action` only ever calls `gh release upload`, never
  # `gh release create`, so it attaches to the draft without revealing it.
  build:
    name: 🛠️ Build & Upload (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Deliberately no `environment:`. This job needs no release secret — the
    # default GITHUB_TOKEN can upload to a release in its own repository — and
    # gating every matrix leg on the environment would demand one approval each
    # if it ever gains a required reviewer. The gate belongs on `crates-io`.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the Apple Silicon runner rather than built on an
          # Intel one: the macOS SDK is universal, so this only needs the target
          # — which `upload-rust-binary-action` installs itself — and it does not
          # depend on the availability of an Intel runner image.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build exactly what is being released, not a branch tip that may
          # have moved since gh-ship created the tag.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')

      - uses: taiki-e/install-action@v2
        with:
          tool: cross
        if: contains(matrix.target, '-musl')

      - run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
        if: endsWith(matrix.target, 'windows-msvc')

      # Ships the man pages alongside the binary: `git wipe --help` is rewritten
      # by git into `git help wipe`, which runs `man git-wipe` and fails when no
      # page is installed. Built for the host rather than ${{ matrix.target }} —
      # the output is plain text, identical for every target, and a host build
      # avoids needing to run a cross-compiled build script.
      - name: Generate man pages and completions
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo build --message-format=json 2>/dev/null \
            | jq -r 'select(.reason == "build-script-executed") | select(.package_id | test("git-wipe")) | .out_dir' \
            | tail -n 1)
          test -n "$out"
          mkdir -p dist/man dist/completions
          cp "$out"/man/*.1 dist/man/
          cp "$out"/completions/* dist/completions/

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: git-wipe
          target: ${{ matrix.target }}
          # Must be a *fully-formed* tag ref: the action bails on anything not
          # starting with `refs/tags/`. It is passed explicitly because this
          # workflow is dispatched, so GITHUB_REF names a branch, not the tag.
          ref: refs/tags/${{ inputs.tag }}
          # LICENSE ships too: MIT is not one of the common licenses Arch keeps
          # in /usr/share/licenses/common, so `git-wipe-bin` has to
          # install the file itself and can only take it from here.
          include: dist/man,dist/completions,LICENSE,README.md
          tar: all
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # The source tarball is what distribution packagers build from — the
  # `git-wipe` AUR package consumes it. It is
  # published here rather than relying on GitHub's auto-generated tag archive,
  # whose bytes (and therefore its checksum) are not guaranteed to be stable
  # over time, which a PKGBUILD's `sha256sums` cannot tolerate.
  source:
    name: 📦 Source tarball
    runs-on: ubuntu-latest
    # Same reasoning as `build`: uploading to a release in this repository needs
    # no secret beyond the default token.
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          # `git archive` resolves the tag object, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false

      # The prefix and the file name carry the bare version, so a PKGBUILD can
      # `cd "$pkgname-$pkgver"` with the pkgver it already declares. The tag
      # itself keeps its `v`, which is why the two are not interchangeable.
      - name: Build the source tarball
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="git-wipe-${version}/" \
            -o "dist/git-wipe-${version}.tar.gz" "$TAG"
          # Cargo.lock is tracked, so the archive supports `cargo build --locked`.
          # The listing goes through a file rather than a pipe into `grep -q`:
          # grep exits on the first match, tar takes SIGPIPE, and `pipefail`
          # turns that into a failure of the very check that just passed.
          tar -tzf "dist/git-wipe-${version}.tar.gz" > "$RUNNER_TEMP/files"
          grep -qx "git-wipe-${version}/Cargo.lock" "$RUNNER_TEMP/files"
          cd dist
          sha256sum "git-wipe-${version}.tar.gz" \
            > "git-wipe-${version}.tar.gz.sha256"

      # The release exists as a DRAFT: gh-ship created it before dispatching
      # this workflow and undrafts it once we succeed. Upload, never create.
      - name: Upload to the draft release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

  # Publishing to crates.io is irreversible, so it happens while the release is
  # still a draft: if it fails, gh-ship never makes the release visible.
  crates-io:
    name: 📤 Publish to crates.io
    needs: [build, source]
    runs-on: ubuntu-latest

    # This is the deployment. The `url:` registers it in the repository's
    # deployment list and links straight to what shipped.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

    permissions:
      contents: read
      # Required by crates.io trusted publishing: the OIDC token is what
      # authenticates us, so there is no long-lived registry secret.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
