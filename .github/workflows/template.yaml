name: 🔄 Template

# Has the template this project was rendered from moved?
#
# Scheduled rather than a job in ♻️ CI, deliberately. A template moving is not
# a fault in anyone's pull request, and failing their check for it would teach
# people to ignore a red X that is not about their change. This runs on its own
# clock and fails on its own terms.

on:
  schedule:
    # Monday morning. Weekly is the right cadence for something whose remedy is
    # "read a diff and decide", not "fix it now".
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: template
  cancel-in-progress: false

jobs:
  drift:
    name: 🔄 Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # git-tpl comes from mise.toml, pinned and provenance-verified.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      # `actions/checkout` fetches `refs/heads/*` and `refs/tags/*` and nothing
      # else, so `refs/tpl/<id>` is absent here however many times this project
      # has been updated. `update` resolves that ref as an optional and creates
      # it when there is none, so re-rendering from scratch is the whole job —
      # no ref has to have been pushed for this to work.
      #
      # Nothing is written that outlives the runner: `update` touches the ref,
      # never HEAD, the index or the worktree.
      - name: Re-render the template
        run: git tpl update

      - name: Report what merging it would change
        run: git tpl diff --exit-code --stat
