name: 🚢 Ship

# gh-ship releases git-wipe. This workflow does none of the release
# work itself; it drives the two halves of the lifecycle:
#
#   push to main          -> `gh ship prepare` -> opens or updates the Release PR
#   Release PR is merged  -> `gh ship release` -> tags, drafts, publishes assets
#                                                 and the crate, then makes the
#                                                 release public
#
# Nothing to release is the common case for the first half, and costs one
# prepare-release run reporting `changed: false` and exiting 0.

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

# These apply when falling back to GITHUB_TOKEN; the App token carries its own.
permissions:
  contents: write # create the release branch
  actions: write # workflow_dispatch, and download its artifact
  pull-requests: write # create or update the Release PR
  issues: write # create missing labels

# One release action at a time. Merging the Release PR fires *both* triggers —
# the merge is also a push to main — and this queue is what keeps them from
# interleaving. Either order is correct: if prepare runs first its
# pending-release guard short-circuits, and if release runs first the next
# prepare finds nothing to release.
#
# Never cancel: both commands block on a dispatched workflow run, and cancelling
# here would orphan that run rather than stop it.
concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  prepare:
    name: 🚢 Prepare
    if: github.event_name == 'push' && github.repository_owner == 'noirbizarre'
    runs-on: ubuntu-latest
    # `gh ship prepare` blocks on the dispatched workflow; cap the wait well
    # below its own 60 minute default so a stuck run fails the job visibly.
    timeout-minutes: 30

    # Same pattern as 🚀 Prepare Release: the App credentials live in this
    # environment, and starting a release is not itself a deployment, so it
    # stays out of the deployment history. 📦 Publish Release registers one.
    environment:
      name: release
      deployment: false

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          # The Client ID is not a secret, so it lives in a variable — but it
          # is scoped to the `release` environment, which is why every job that
          # mints a token must declare that environment. Without it the
          # expansion is silently empty and the mint fails confusingly.
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        # A plain shallow checkout is enough: `gh ship prepare` reads
        # .github/ship.yml and discovers workflows from .github/workflows,
        # both of which are in the tree. gh-ship never shells out to git.

      - name: Install gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh extension install noirbizarre/gh-ship

      - name: Prepare the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh ship prepare

  release:
    name: 🚢 Release
    # Only the Release PR, and only when it actually merged — `closed` fires for
    # abandoned pull requests too.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'release/next'
      && github.repository_owner == 'noirbizarre'
    runs-on: ubuntu-latest
    # `gh ship release` waits on the publish workflow, which cross-compiles
    # nine targets and publishes the crate — so this is the job most likely to
    # run long. Capped below 60 on purpose: an App installation token expires
    # after an hour, and a job that outlives its own token fails at whichever
    # `gh` call happens to land after the deadline. Also below gh-ship's own
    # SHIP_RUN_TIMEOUT default, so a stuck run fails here rather than hanging.
    timeout-minutes: 50

    environment:
      name: release
      deployment: false

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          # Scoped to the `release` environment, as above.
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh extension install noirbizarre/gh-ship

      # Tags the merge commit, creates the release as a draft, dispatches
      # 📦 Publish Release to attach the binaries and publish the crate, then
      # makes it public.
      - name: Ship the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh ship release
