name: 🚀 Prepare Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Produce the artifact but do not commit or push
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

# Every API call in this workflow — the push, and git-cliff's metadata reads —
# authenticates as the GitHub App, whose installation permissions apply instead
# of these. These cover `actions/checkout` alone, which only reads.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Well below the App installation token's one-hour lifetime: a job that
    # outlives its own token fails at whichever `gh` call lands after the
    # deadline, which is a confusing way to learn a build hung.
    timeout-minutes: 30

    # APP_CLIENT_ID and APP_PRIVATE_KEY live only in the `release` environment,
    # and an environment variable resolves only in a job that declares one —
    # which is why this key is load-bearing for authentication, not just gating.
    # Preparing a release is not a deployment, so this gates secrets and reviews
    # without registering one. The deployment is publish-release.
    environment:
      name: release
      deployment: false

    steps:
      # The push below must trigger CI on the release branch, which the default
      # GITHUB_TOKEN cannot do. An App installation token can, and is revoked
      # when this job ends.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Full history *and* tags: git-cliff derives the next version from
          # the last tag, and a shallow clone has neither.
          fetch-depth: 0
          fetch-tags: true
          # The default GITHUB_TOKEN cannot trigger workflows, so a Release PR
          # it authors would show no CI results.
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # git-cliff is pinned by mise.lock: a changelog tool that changes
      # version between releases would silently change our release notes.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      # Installed up front because two later steps need it: `gh ship sign`
      # and the artifact validation.
      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # --- versioning: ours, not gh-ship's ---------------------------------

      - name: Compute the next version
        id: version
        # `cliff.toml` declares `[remote.github]`, so git-cliff calls the GitHub
        # API — even for `--bumped-version`, which needs none of the result.
        # Unauthenticated that is 60 requests per hour *per IP*, and
        # GitHub-hosted runners share IPs, so the budget is spent by strangers
        # before the job starts. It does not degrade gracefully: git-cliff
        # parses the rate-limit error as a commit list and panics.
        #
        # The App installation token is used rather than `secrets.GITHUB_TOKEN`
        # because it carries the higher limit — 5000/hour against 1000/hour per
        # repository — and the App is already authorised for everything read
        # here. Set per step, not at job level: a step output is not resolvable
        # in `jobs.<id>.env`.
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Compare against the last *tag*, not the version in Cargo.toml.
          # Cargo.toml already carries the version being prepared, so
          # comparing to it would report "no change" for the very first
          # release and make bootstrapping impossible.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next_tag="$(git cliff --bumped-version)"

          # This project tags without a `v` prefix, so the tag and the version
          # are the same string. They stay separate outputs because the release
          # artifact keeps them separate: the tag convention is a project's own
          # choice, and gh-ship never derives one from the other.
          {
            echo "tag=$next_tag"
            echo "version=$next_tag"
          } >> "$GITHUB_OUTPUT"

          if [ "$last_tag" = "$next_tag" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new releasable commits since ${last_tag:-the beginning}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${last_tag:-<nothing>} -> $next_tag"
          fi

      - name: Generate the changelog
        if: steps.version.outputs.changed == 'true'
        env:
          # Same reason as the step above.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git cliff --bump -o CHANGELOG.md

          # Release notes are scratch input for `jq --rawfile`, not a
          # source file. Keep them out of the worktree so `git add -A`
          # cannot commit them.
          git cliff --unreleased --bump --strip all -o "$RUNNER_TEMP/ship-notes.md"

          # The `## <version> - <date>` heading belongs to CHANGELOG.md. The
          # Release PR and the GitHub Release both carry the version in their
          # own title, so drop the first heading and the blank lines ahead of
          # it. The `0,/^## /` range stops at the first match, leaving later
          # `##` sections such as New Contributors alone.
          sed -i -e '0,/^## /{/^## /d}' -e '/./,$!d' "$RUNNER_TEMP/ship-notes.md"

      - name: Apply the version
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only the first `version =` belongs to [package].
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      - name: Commit and push
        if: steps.version.outputs.changed == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Git refuses to commit without an identity, and a runner has none.
          # Which identity barely matters: `gh ship sign`, next, re-creates this
          # commit through the API, and the re-created one takes its author
          # from the token and its committer from GitHub.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || \
            git commit -m "chore(release): $VERSION"
          git push origin HEAD

      # A commit created on the runner is never signed, whichever token pushes
      # it: signing needs a key, and there is no key here. GitHub *will* sign a
      # commit it creates itself for a bot, but only when the request carries
      # no author or committer of its own — so the only way to get the Verified
      # badge without putting a signing key in our secrets is to push first and
      # then have the API re-create the tip. That is what `gh ship sign` does.
      # It exits non-zero rather than silently rewriting history if GitHub
      # hands back an unsigned commit, and leaves an already-signed commit
      # alone.
      - name: Sign the release commit
        if: steps.version.outputs.changed == 'true' && !inputs.dry_run
        run: gh ship sign
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # --- the protocol ------------------------------------------------------

      - name: Write the release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.changed }}" != "true" ]; then
            jq -n '{schemaVersion: 1, changed: false}' > ship.release.json
          else
            jq -n \
              --arg version "$VERSION" \
              --arg tag     "$TAG" \
              --rawfile notes "$RUNNER_TEMP/ship-notes.md" \
              '{
                "$schema": "https://noirbizarre.github.io/gh-ship/schema/release/v1.json",
                schemaVersion: 1,
                changed: true,
                version: $version,
                tag: $tag,
                release: { notes: $notes }
              }' > ship.release.json
          fi
          cat ship.release.json

      - name: Validate the release artifact
        run: gh ship validate ship.release.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: ship-release
          path: ship.release.json
          if-no-files-found: error
