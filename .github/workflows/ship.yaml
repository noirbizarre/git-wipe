
name: 🚢 Ship

# gh-ship runs the release. This workflow does none of the release work itself;
# it drives the two halves of the lifecycle:
#
#   push to main          -> `gh ship prepare` -> opens or updates the Release PR
#   Release PR is merged  -> `gh ship release` -> tags, drafts, publishes assets,
#                                                 then makes the release public
#
# Nothing to release is the common case for the first half, and costs one
# prepare-release run reporting `changed: false` and exiting 0.

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

# gh-ship authenticates as a GitHub App, so it carries its own permissions and
# ignores these. They cover `actions/checkout` alone, which only reads.
permissions:
  contents: read

# One release action at a time. Merging the Release PR fires *both* triggers —
# the merge is also a push to main — and this queue is what keeps them from
# interleaving. Either order is correct: if prepare runs first its
# pending-release guard short-circuits, and if release runs first the next
# prepare finds nothing to release.
#
# Never cancel: both commands block on a dispatched workflow run, and cancelling
# here would orphan that run rather than stop it.
concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  prepare:
    name: 🚢 Prepare
    # A public fork's push to main would otherwise also trigger this job,
    # which then fails noisily for lack of the App/release secrets a fork
    # does not have.
    if: github.event_name == 'push' && github.repository_owner == 'noirbizarre'
    runs-on: ubuntu-latest
    # `gh ship prepare` blocks on the dispatched workflow until
    # SHIP_RUN_TIMEOUT expires, 60 minutes by default. Cap the job well below
    # that so a stuck run fails visibly.
    timeout-minutes: 30

    # APP_CLIENT_ID and APP_PRIVATE_KEY both live in this environment, and
    # starting a release is not itself a deployment, so it stays out of the
    # deployment history. 📦 Publish Release is the only job that registers one.
    environment:
      name: release
      deployment: false

    steps:
      # An installation token, minted for this job and revoked when it ends.
      # Unlike a PAT it cannot be set once in the job's `env:` — a step output
      # is not resolvable there — so every `gh` step below sets it itself.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # gh-ship authenticates its own API calls; a persisted default-token
          # credential here would only be unused attack surface, since nothing
          # in this job shells out to `git push`.
          persist-credentials: false

      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Prepare the release
        run: gh ship prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: 🚢 Release
    # Only the Release PR, and only when it actually merged — `closed` fires for
    # abandoned pull requests too. Same fork guard as `prepare`, above.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'release/next'
      && github.repository_owner == 'noirbizarre'
    runs-on: ubuntu-latest
    # `gh ship release` waits on the publish workflow, which cross-compiles the
    # whole target matrix. Capped below the App installation token's one-hour
    # lifetime: a longer job would outlive its own credentials.
    timeout-minutes: 50

    environment:
      name: release
      deployment: false

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Tags the merge commit, creates the release as a draft, dispatches
      # 📦 Publish Release to attach the binaries, then makes it public.
      - name: Ship the release
        run: gh ship release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
